<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopilot App</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #fdf6f0; --card: #ffffff; --text: #333; --accent: #ff6b81; }
        .dark-mode { --bg: #1e272e; --card: #2f3640; --text: #f5f6fa; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .profile-btn { padding: 10px 20px; border: 2px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .profile-btn.active { background: var(--accent); color: white; }
        .action-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .mini-btn { background: #eee; border: none; padding: 10px; border-radius: 50%; cursor: pointer; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex: 1; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .col { background: #fce8e8; padding: 15px; border-radius: 10px; }
        .task { background: var(--card); padding: 10px; border-radius: 5px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .yt-link { color: red; font-size: 12px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h2>🌸 Kopilot App</h2>
    <div>
        <button class="profile-btn active" id="btnBen" onclick="profilDegistir('ben')">Ben</button>
        <button class="profile-btn" id="btnSevgili" onclick="profilDegistir('sevgili')">Sevgilim</button>
    </div>
</div>

<div class="action-box">
    <button class="mini-btn" onclick="toggleDarkMode()">🌙</button>
    <button class="mini-btn" onclick="toggleFullScreen()">⛶</button>
    <button class="mini-btn" onclick="toggleTimer()" id="timerDisplay">⏱️</button>
</div>

<div class="input-box">
    <input type="text" id="ders" placeholder="Ders">
    <input type="text" id="kaynak" placeholder="Kaynak">
    <input type="text" id="ytUrl" placeholder="YouTube Linki">
    <button class="btn-add" onclick="gorevEkle()">Ekle</button>
</div>

<div class="board" id="tahta"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyChfFEva4PkZ48zy9rAkWJV7Z_W-5o6BFE",
  databaseURL: "https://kopilot-v16-default-rtdb.firebaseio.com",
  projectId: "kopilot-v16",
  storageBucket: "kopilot-v16.firebasestorage.app",
  messagingSenderId: "386587888795",
  appId: "1:386587888795:web:6f4ef1fba8923f4546ca3e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let aktifProfil = 'ben';

function profilDegistir(p) { aktifProfil = p; document.getElementById('btnBen').classList.toggle('active', p==='ben'); document.getElementById('btnSevgili').classList.toggle('active', p==='sevgili'); verileriYukle(); }
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
function toggleFullScreen() { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); }
let timerRunning = false;
function toggleTimer() { timerRunning = !timerRunning; alert(timerRunning ? "Sayaç Başladı!" : "Sayaç Durdu!"); }

function verileriYukle() {
    db.ref('programlar/' + aktifProfil).on('value', (snap) => {
        const data = snap.val();
        const tahta = document.getElementById('tahta');
        tahta.innerHTML = '';
        ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"].forEach(gun => {
            let col = `<div class="col"><h4>${gun}</h4>`;
            if(data) {
                Object.keys(data).forEach(key => {
                    if(data[key].gun === gun) {
                        col += `<div class="task"><b>${data[key].ders}</b><br>${data[key].kaynak}${data[key].ytUrl ? `<a href="${data[key].ytUrl}" class="yt-link" target="_blank">▶️ Video</a>` : ''}</div>`;
                    }
                });
            }
            tahta.innerHTML += col + '</div>';
        });
    });
}

function gorevEkle() {
    db.ref('programlar/' + aktifProfil).push({
        gun: "Pazartesi", 
        ders: document.getElementById('ders').value,
        kaynak: document.getElementById('kaynak').value,
        ytUrl: document.getElementById('ytUrl').value
    });
}
verileriYukle();
</script>
</body>
</html>
