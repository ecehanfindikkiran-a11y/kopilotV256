<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Kopilot Plus - Live Sync</title>
    
    <!-- FIREBASE KÜTÜPHANELERİ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #fdf6f0;
            --card-color: white;
            --text-color: #333;
            --header-border: #ffeaa7;
            --day-bg: #fafafa;
            --day-border: #eee;
            --form-bg: #fff5f6;
        }

        body.dark-mode {
            --bg-color: #1e272e;
            --card-color: #2f3640;
            --text-color: #f5f6fa;
            --header-border: #485460;
            --day-bg: #353b48;
            --day-border: #718093;
            --form-bg: #2f3640;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); transition: background 0.3s, color 0.3s; }
        .container { max-width: 1150px; margin: auto; background: var(--card-color); padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--header-border); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        h2 { color: #ff6b81; margin: 0; }
        
        .sync-status { font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .sync-active { background: #e8f8f5; color: #2ecc71; }

        .profile-switch { display: flex; gap: 8px; background: #fff0f3; padding: 6px; border-radius: 10px; align-items: center; }
        .profile-btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; background: transparent; color: #ff6b81; transition: 0.2s; }
        .profile-btn.active { background: #ff6b81; color: white; }

        .app-tools { display: flex; gap: 8px; align-items: center; }
        .tool-btn { background: #fff0f3; border: 1px solid #ffd8d8; color: #ff6b81; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .timer-btn { background: #ff6b81; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: var(--form-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        select, input { padding: 10px; border: 1px solid #ffd8d8; border-radius: 8px; font-size: 13px; outline: none; background: var(--card-color); color: var(--text-color); }
        
        .days-checkboxes { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; background: var(--card-color); padding: 10px; border-radius: 8px; border: 1px solid #ffe1e1; align-items: center; }
        .days-checkboxes label { font-size: 13px; font-weight: 600; color: #555; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        body.dark-mode .days-checkboxes label { color: #aaa; }
        
        .btn-add { grid-column: 1 / -1; background: #ff6b81; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-add:hover { background: #ee5253; }

        .weekly-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 25px; }
        
        .day-column { background: var(--day-bg); border: 2px dashed var(--day-border); border-radius: 10px; padding: 10px; min-height: 280px; transition: background 0.2s; }
        .day-column.drag-over { background: #ffeaa7; border-color: #fdcb6e; }
        .day-header { text-align: center; font-weight: bold; padding: 8px; background: #ffeaa7; color: #d63031; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
        
        .task-card { background: var(--card-color); border-left: 5px solid #ff6b81; padding: 10px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; font-size: 12px; cursor: grab; transition: all 0.2s; }
        .task-card:active { cursor: grabbing; }
        .task-card.youtube { border-left-color: #ff0000; }
        
        .task-card.completed { background: #e8f8f5; border-left-color: #2ecc71 !important; }
        body.dark-mode .task-card.completed { background: #1e3720; }
        .task-card.completed b { color: #27ae60; }
        .completed-badge { display: none; background: #2ecc71; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-top: 4px; }
        .task-card.completed .completed-badge { display: inline-block; }

        .task-card .tag { display: inline-block; background: #fff0f3; color: #ff6b81; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-bottom: 4px; font-size: 10px; }
        .task-card .kat-tag { display: inline-block; background: #eccc68; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-left: 4px; }
        .yt-link-btn { display: inline-block; margin-top: 5px; color: #ff0000; text-decoration: none; font-weight: bold; font-size: 11px; }

        .btn-del { position: absolute; top: 5px; right: 5px; background: none; border: none; color: #b2bec3; cursor: pointer; font-weight: bold; font-size: 14px; z-index: 2; }
        .btn-del:hover { color: #d63031; }

        .summary-bar { margin-top: 20px; background: #eccc68; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn-clear { background: #d63031; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--card-color); padding: 20px; border-radius: 12px; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal h3 { color: #ff6b81; margin-top: 0; }
        .modal input[type=range] { width: 100%; margin: 15px 0; }
        .modal-close { background: #ff6b81; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>🌸 Kopilot Plus <span class="sync-status sync-active">● Canlı Bağlantı Aktif</span></h2>
        
        <div class="app-tools">
            <button class="timer-btn" id="timerBtn" onclick="toggleTimer()">⏱️ 25:00</button>
            <button class="tool-btn" onclick="toggleDarkMode()">🌙 Tema</button>
            <button class="tool-btn" onclick="toggleFullScreen()">⛶ Ekran</button>
        </div>

        <div class="profile-switch">
            <button class="profile-btn active" id="btnBen" onclick="profilDegistir('ben')">👑 Benim Programım</button>
            <button class="profile-btn" id="btnSevgili" onclick="profilDegistir('sevgili')">🤍 Sevgilimin Programı</button>
        </div>
    </div>
    
    <div class="form-grid">
        <select id="seviye">
            <option value="TYT">TYT</option>
            <option value="AYT">AYT</option>
        </select>
        
        <select id="kategori">
            <option value="Soru Bankası">📚 Soru Bankası</option>
            <option value="Konu Çalışması">📖 Konu Çalışması</option>
            <option value="YouTube Kampı">▶️ YouTube Kampı</option>
            <option value="Tekrar">🔄 Tekrar</option>
            <option value="Deneme">📝 Deneme</option>
        </select>

        <input type="text" id="ders" placeholder="Ders Adı (ör: Matematik)">
        <input type="text" id="kaynak" placeholder="Kaynak / Kanal (ör: 345, Aker Hoca)">
        <input type="text" id="konu" placeholder="Konu / Kamp (ör: Dil Bilgisi)">
        
        <input type="number" id="toplamBirim" placeholder="Test / Video Sayısı" min="1">
        <input type="number" id="birimSüre" placeholder="1 Test/Video Kaç Dk?" value="15" min="1">
        <input type="text" id="ytUrl" placeholder="YouTube Playlist Linki (Opsiyonel)">
        
        <div class="days-checkboxes">
            <span style="font-size: 13px; font-weight: bold; color: #ff6b81;">Dağıtılacak Günler:</span>
            <label><input type="checkbox" value="Pazartesi"> Pzt</label>
            <label><input type="checkbox" value="Salı"> Sal</label>
            <label><input type="checkbox" value="Çarşamba"> Çar</label>
            <label><input type="checkbox" value="Perşembe"> Per</label>
            <label><input type="checkbox" value="Cuma"> Cuma</label>
            <label><input type="checkbox" value="Cumartesi"> Cmt</label>
            <label><input type="checkbox" value="Pazar"> Paz</label>
        </div>

        <button class="btn-add" onclick="gorevEkle()">Programıma Ekle ve Kaydet</button>
    </div>

    <div class="summary-bar">
        <span id="toplamOzet">Haftalık Toplam: 0 Görev (~0 Saat)</span>
        <span id="ilerlemeYuzde" style="background: white; color: #ff6b81; padding: 4px 10px; border-radius: 6px;">İlerleme: %0</span>
        <button class="btn-clear" onclick="tumunuTemizle()">Bu Profili Sıfırla</button>
    </div>

    <div class="weekly-board" id="haftalikTahta"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>Ne kadarını tamamladın aşkım?</h3>
        <p id="modalTaskName" style="font-weight: bold; font-size: 14px; color: #555;"></p>
        <p style="font-size: 18px; color: #ff6b81; font-weight: bold;">
            Tamamlanan: <span id="modalVal">0</span> / <span id="modalMax">0</span>
        </p>
        <input type="range" id="modalRange" min="0" oninput="modalSliderChange(this.value)">
        <br>
        <button class="modal-close" onclick="modalKapat()">Tamamdır</button>
    </div>
</div>

<script>
// FIREBASE KURULUMU
const firebaseConfig = {
  apiKey: "AIzaSyChfFEva4PkZ48zy9rAkWJV7Z_W-5o6BFE",
  authDomain: "kopilot-v16.firebaseapp.com",
  databaseURL: "https://kopilot-v16-default-rtdb.firebaseio.com",
  projectId: "kopilot-v16",
  storageBucket: "kopilot-v16.firebasestorage.app",
  messagingSenderId: "386587888795",
  appId: "1:386587888795:web:6f4ef1fba8923f4546ca3e",
  measurementId: "G-LXVRB56P50"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const gunler = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
let aktifProfil = 'ben';
let localProgramData = [];

// YENİ EKLENEN ÖZELLİKLER (SAYAÇ, TEMA, TAM EKRAN)
let timerInterval = null;
let timeLeft = 25 * 60;
let isTimerRunning = false;

function toggleTimer() {
    const btn = document.getElementById('timerBtn');
    if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = "⏱️ " + formatTime(timeLeft) + " (Başlat)";
    } else {
        isTimerRunning = true;
        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                btn.innerText = "⏱️ " + formatTime(timeLeft);
            } else {
                clearInterval(timerInterval);
                isTimerRunning = false;
                alert("Süre bitti aşkım! Harika çalıştın 🎉 Mola zamanı.");
                timeLeft = 25 * 60;
                btn.innerText = "⏱️ 25:00";
            }
        }, 1000);
    }
}

function formatTime(seconds) {
    let m = Math.floor(seconds / 60);
    let s = seconds % 60;
    return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

// CANLI DİNLEYİCİ
function liveListen() {
    db.ref('programlar/' + aktifProfil).on('value', (snapshot) => {
        localProgramData = snapshot.val() || [];
        tahtayiCiz();
    });
}

function saveProgramData(data) {
    db.ref('programlar/' + aktifProfil).set(data);
}

function profilDegistir(profil) {
    db.ref('programlar/' + aktifProfil).off();
    aktifProfil = profil;
    document.getElementById('btnBen').classList.toggle('active', profil === 'ben');
    document.getElementById('btnSevgili').classList.toggle('active', profil === 'sevgili');
    liveListen();
}

function tahtayiCiz() {
    const tahta = document.getElementById('haftalikTahta');
    tahta.innerHTML = '';
    
    let toplamBirim = 0;
    let tamamlananBirim = 0;
    let toplamDakika = 0;

    gunler.forEach(gun => {
        const gunFiltre = localProgramData.filter(item => item.gun === gun);
        let gunlukDakika = 0;
        
        let html = `
            <div class="day-column" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, '${gun}')">
                <div class="day-header">${gun}</div>
        `;

        gunFiltre.forEach((item) => {
            toplamBirim += item.toplam;
            tamamlananBirim += (item.tamamlanan || 0);
            const dk = item.toplam * item.sure;
            toplamDakika += dk;
            gunlukDakika += dk;

            const birimAdi = item.kategori === "YouTube Kampı" ? "Video" : "Test";
            const isCompleted = (item.tamamlanan || 0) >= item.toplam;
            
            let cardClass = "task-card";
            if (item.kategori === "YouTube Kampı") cardClass += " youtube";
            if (isCompleted) cardClass += " completed";

            html += `
                <div class="${cardClass}" draggable="true" ondragstart="drag(event, ${item.id})" onclick="modalAc(${item.id})">
                    <button class="btn-del" onclick="gorevSil(${item.id}, event)">×</button>
                    <span class="tag">${item.seviye} ${item.ders}</span>
                    <span class="kat-tag">${item.kategori}</span><br>
                    <b>${item.kaynak}</b><br>
                    <span>${item.konu}</span><br>
                    <div style="margin-top: 4px;"><b>${item.toplam} ${birimAdi}</b> (~${dk} dk)</div>
                    <div style="margin-top: 4px; font-weight: bold;">
                        İlerleme: ${item.tamamlanan || 0} / ${item.toplam}
                    </div>
                    <span class="completed-badge">✓ Tamamlandı!</span>
                    ${item.ytUrl ? `<br><a href="${item.ytUrl}" target="_blank" class="yt-link-btn" onclick="event.stopPropagation()">▶️ Kampa Git</a>` : ''}
                </div>
            `;
        });

        if (gunlukDakika > 0) {
            html += `<div style="text-align:center; font-size:11px; color:#666; font-weight:bold; margin-top:5px;">Günlük: ~${(gunlukDakika/60).toFixed(1)} Saat</div>`;
        }

        html += `</div>`;
        tahta.innerHTML += html;
    });

    const yuzde = toplamBirim > 0 ? Math.round((tamamlananBirim / toplamBirim) * 100) : 0;
    document.getElementById('toplamOzet').innerText = 
        `Haftalık Toplam: ${toplamBirim} Birim Görev (~${(toplamDakika / 60).toFixed(1)} Saat)`;
    document.getElementById('ilerlemeYuzde').innerText = `İlerleme: %${yuzde}`;
}

function drag(ev, id) { ev.dataTransfer.setData("taskId", id); }
function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }

function drop(ev, yeniGun) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('drag-over');
    const id = parseFloat(ev.dataTransfer.getData("taskId"));
    const item = localProgramData.find(x => x.id === id);
    if (item) {
        item.gun = yeniGun;
        saveProgramData(localProgramData);
    }
}

function gorevEkle() {
    const seviye = document.getElementById('seviye').value;
    const kategori = document.getElementById('kategori').value;
    const ders = document.getElementById('ders').value || "Genel Ders";
    const kaynak = document.getElementById('kaynak').value || "Kaynak";
    const konu = document.getElementById('konu').value || "Genel Konu";
    const toplamBirim = parseInt(document.getElementById('toplamBirim').value);
    const birimSüre = parseInt(document.getElementById('birimSüre').value) || 15;
    const ytUrl = document.getElementById('ytUrl').value;
    
    const seciliGunler = Array.from(document.querySelectorAll('.days-checkboxes input:checked')).map(cb => cb.value);

    if (!toplamBirim || seciliGunler.length === 0) {
        alert("Lütfen test/video sayısını ve en az 1 gün seç aşkım!");
        return;
    }

    const gunBasi = Math.floor(toplamBirim / seciliGunler.length);
    let kalan = toplamBirim % seciliGunler.length;

    seciliGunler.forEach((gun, index) => {
        let eklenecek = gunBasi + (index < kalan ? 1 : 0);
        if (eklenecek > 0) {
            localProgramData.push({
                id: Date.now() + Math.random(),
                seviye, kategori, ders, kaynak, konu,
                toplam: eklenecek, sure: birimSüre, tamamlanan: 0, ytUrl, gun
            });
        }
    });

    saveProgramData(localProgramData);
    document.getElementById('toplamBirim').value = '';
    document.getElementById('ytUrl').value = '';
    document.querySelectorAll('.days-checkboxes input').forEach(cb => cb.checked = false);
}

let aktifTaskId = null;
function modalAc(id) {
    const item = localProgramData.find(x => x.id === id);
    if (!item) return;

    aktifTaskId = id;
    document.getElementById('modalTaskName').innerText = `${item.ders} - ${item.konu} (${item.kaynak})`;
    document.getElementById('modalVal').innerText = item.tamamlanan || 0;
    document.getElementById('modalMax').innerText = item.toplam;
    
    const range = document.getElementById('modalRange');
    range.max = item.toplam;
    range.value = item.tamamlanan || 0;

    document.getElementById('modalOverlay').style.display = 'flex';
}

function modalSliderChange(val) {
    document.getElementById('modalVal').innerText = val;
    const item = localProgramData.find(x => x.id === aktifTaskId);
    if (item) {
        item.tamamlanan = parseInt(val);
        saveProgramData(localProgramData);
    }
}

function modalKapat() { document.getElementById('modalOverlay').style.display = 'none'; }

function gorevSil(id, event) {
    event.stopPropagation();
    localProgramData = localProgramData.filter(item => item.id !== id);
    saveProgramData(localProgramData);
}

function tumunuTemizle() {
    if (confirm("Bu profildeki tüm haftalık programı silmek istediğine emin misin?")) {
        saveProgramData([]);
    }
}

// Başlangıçta dinlemeyi başlat
liveListen();
</script>

</body>
</html>
